<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 780">
<title>From the spot to the screen</title>
<style>
  .bg { fill: #ffffff; }
  .bx { fill: #ffffff; stroke: #c3cdd7; stroke-width: 1.2; }
  .bx-main { fill: #dcecf2; stroke: #0d6a8a; stroke-width: 1.4; }
  .bx-group { fill: none; stroke: #c3cdd7; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .bx-pass { fill: #dcefe4; stroke: #1b7547; stroke-width: 1.4; }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; }
  .t { fill: #16212c; font-size: 13px; font-weight: 600; }
  .s { fill: #586877; font-size: 11.5px; }
  .km { fill: #586877; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11px; }
  .lbl { fill: #586877; font-size: 11px; font-style: italic; }
  .ar { stroke: #16212c; stroke-width: 1.3; fill: none; }
  .ar-dash { stroke: #586877; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
  .ar-drop { stroke: #7d8995; stroke-width: 1.3; fill: none; }
  .ar-wait { stroke: #a86300; stroke-width: 1.3; fill: none; }
  .ar-pass { stroke: #1b7547; stroke-width: 1.3; fill: none; }
  .x-drop { fill: #7d8995; font-size: 12px; }
  .x-wait { fill: #a86300; font-size: 12px; font-weight: 500; }
  .x-pass { fill: #1b7547; font-size: 12px; font-weight: 600; }
  .m-ink { fill: #16212c; } .m-muted { fill: #586877; } .m-drop { fill: #7d8995; }
  .m-wait { fill: #a86300; } .m-pass { fill: #1b7547; }
  .edge { stroke: #0d6a8a; stroke-width: 1.2; stroke-dasharray: 2 5; }
  .edge-t { fill: #0d6a8a; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11px; letter-spacing: .06em; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161f28; }
    .bx { fill: #161f28; stroke: #3a4857; }
    .bx-main { fill: #15303c; stroke: #5bb6d8; }
    .bx-group { stroke: #3a4857; }
    .bx-pass { fill: #12301f; stroke: #55c48c; }
    .t { fill: #e2e8ee; } .s, .km, .lbl { fill: #93a2b0; }
    .ar { stroke: #e2e8ee; } .ar-dash { stroke: #93a2b0; } .ar-drop { stroke: #6f7d8a; }
    .ar-wait { stroke: #e3a548; } .ar-pass { stroke: #55c48c; }
    .x-drop { fill: #6f7d8a; } .x-wait { fill: #e3a548; } .x-pass { fill: #55c48c; }
    .m-ink { fill: #e2e8ee; } .m-muted { fill: #93a2b0; } .m-drop { fill: #6f7d8a; }
    .m-wait { fill: #e3a548; } .m-pass { fill: #55c48c; }
    .edge { stroke: #5bb6d8; } .edge-t { fill: #5bb6d8; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="780" rx="10"/>
      <defs>
        <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-ink"/></marker>
        <marker id="a1m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" class="m-muted"/></marker>
      </defs>

      <!-- sources -->
      <rect class="bx" x="200" y="20" width="100" height="56" rx="6"/>
      <text class="t" x="250" y="44" text-anchor="middle">DX cluster</text>
      <text class="s" x="250" y="61" text-anchor="middle">telnet</text>
      <rect class="bx" x="310" y="20" width="100" height="56" rx="6"/>
      <text class="t" x="360" y="44" text-anchor="middle">RBN</text>
      <text class="s" x="360" y="61" text-anchor="middle">CW · FT8 / FT4</text>
      <rect class="bx" x="420" y="20" width="100" height="56" rx="6"/>
      <text class="t" x="470" y="44" text-anchor="middle">WSJT-X</text>
      <text class="s" x="470" y="61" text-anchor="middle">your decodes</text>

      <rect class="bx-group" x="545" y="10" width="160" height="148" rx="8"/>
      <text class="lbl" x="625" y="26" text-anchor="middle">with rules of their own</text>
      <rect class="bx" x="557" y="34" width="136" height="52" rx="6"/>
      <text class="t" x="625" y="56" text-anchor="middle">Ventanas</text>
      <text class="s" x="625" y="73" text-anchor="middle">ITS HOUR, hourly</text>
      <rect class="bx" x="557" y="96" width="136" height="52" rx="6"/>
      <text class="t" x="625" y="118" text-anchor="middle">VHF openings</text>
      <text class="s" x="625" y="135" text-anchor="middle">50–144 MHz</text>

      <line class="ar" x1="250" y1="76" x2="300" y2="118" marker-end="url(#a1)"/>
      <line class="ar" x1="360" y1="76" x2="360" y2="118" marker-end="url(#a1)"/>
      <line class="ar" x1="470" y1="76" x2="420" y2="118" marker-end="url(#a1)"/>
      <text class="lbl" x="372" y="102">spots</text>

      <!-- prepare -->
      <rect class="bx" x="200" y="120" width="320" height="56" rx="6"/>
      <text class="t" x="360" y="143" text-anchor="middle">Prepare the spot</text>
      <text class="s" x="360" y="161" text-anchor="middle">mode · band · country (cty) · no duplicates</text>
      <line class="ar" x1="360" y1="176" x2="360" y2="214" marker-end="url(#a1)"/>

      <!-- decide -->
      <rect class="bx-main" x="200" y="216" width="320" height="120" rx="8"/>
      <text class="t" x="360" y="250" text-anchor="middle">The gates</text>
      <text class="s" x="360" y="272" text-anchor="middle">bands, modes, what you need,</text>
      <text class="s" x="360" y="289" text-anchor="middle">confirmation, near you</text>
      <text class="km" x="360" y="316" text-anchor="middle">→ figure 2</text>

      <rect class="bx" x="20" y="224" width="150" height="52" rx="6"/>
      <text class="t" x="95" y="246" text-anchor="middle">Your logbook</text>
      <text class="s" x="95" y="263" text-anchor="middle">worked · confirmed</text>
      <rect class="bx" x="20" y="284" width="150" height="44" rx="6"/>
      <text class="t" x="95" y="302" text-anchor="middle">PSKReporter · RBN</text>
      <text class="s" x="95" y="318" text-anchor="middle">near? a 2nd skimmer?</text>
      <line class="ar" x1="170" y1="250" x2="198" y2="250" marker-end="url(#a1)"/>
      <line class="ar" x1="170" y1="306" x2="198" y2="306" marker-end="url(#a1)"/>

      <line class="ar" x1="360" y1="336" x2="360" y2="374" marker-end="url(#a1)"/>

      <!-- cooldown -->
      <rect class="bx" x="200" y="376" width="320" height="56" rx="6"/>
      <text class="t" x="360" y="399" text-anchor="middle">Don't repeat</text>
      <text class="s" x="360" y="417" text-anchor="middle">the same alert, silent for 15 min</text>

      <!-- bus to outputs -->
      <line class="ar" x1="360" y1="432" x2="360" y2="466"/>
      <line class="ar-dash" x1="625" y1="158" x2="625" y2="466"/>
      <line class="ar" x1="84" y1="466" x2="636" y2="466"/>
      <line class="ar" x1="84" y1="466" x2="84" y2="488" marker-end="url(#a1)"/>
      <line class="ar" x1="222" y1="466" x2="222" y2="488" marker-end="url(#a1)"/>
      <line class="ar" x1="360" y1="466" x2="360" y2="488" marker-end="url(#a1)"/>
      <line class="ar" x1="498" y1="466" x2="498" y2="488" marker-end="url(#a1)"/>
      <line class="ar" x1="636" y1="466" x2="636" y2="488" marker-end="url(#a1)"/>
      <text class="lbl" x="372" y="458">alert</text>

      <!-- outputs -->
      <rect class="bx" x="20" y="490" width="128" height="56" rx="6"/>
      <text class="t" x="84" y="513" text-anchor="middle">Console</text>
      <text class="s" x="84" y="531" text-anchor="middle">all</text>
      <rect class="bx" x="158" y="490" width="128" height="56" rx="6"/>
      <text class="t" x="222" y="513" text-anchor="middle">Windows pop-up</text>
      <text class="s" x="222" y="531" text-anchor="middle">priority ≤ level</text>
      <rect class="bx" x="296" y="490" width="128" height="56" rx="6"/>
      <text class="t" x="360" y="513" text-anchor="middle">Database</text>
      <text class="s" x="360" y="531" text-anchor="middle">history · pinned</text>
      <rect class="bx" x="434" y="490" width="128" height="56" rx="6"/>
      <text class="t" x="498" y="513" text-anchor="middle">TCI panadapter</text>
      <text class="s" x="498" y="531" text-anchor="middle">if turned on</text>
      <rect class="bx" x="572" y="490" width="128" height="56" rx="6"/>
      <text class="t" x="636" y="513" text-anchor="middle">The dashboard</text>
      <text class="s" x="636" y="531" text-anchor="middle">live</text>

      <!-- boundary -->
      <line class="edge" x1="10" y1="580" x2="710" y2="580"/>
      <text class="edge-t" x="20" y="572">SERVER · DX AGENT</text>
      <text class="edge-t" x="20" y="598">YOUR BROWSER</text>

      <!-- page side -->
      <polyline class="ar" points="636,546 636,638 522,638" marker-end="url(#a1)"/>
      <rect class="bx-main" x="200" y="612" width="320" height="56" rx="8"/>
      <text class="t" x="360" y="635" text-anchor="middle">The dashboard's filters</text>
      <text class="s" x="360" y="653" text-anchor="middle">band, mode, type, search… → figure 3</text>
      <line class="ar" x1="360" y1="668" x2="360" y2="688"/>
      <line class="ar" x1="250" y1="688" x2="470" y2="688"/>
      <line class="ar" x1="250" y1="688" x2="250" y2="708" marker-end="url(#a1)"/>
      <line class="ar" x1="360" y1="688" x2="360" y2="708" marker-end="url(#a1)"/>
      <line class="ar" x1="470" y1="688" x2="470" y2="708" marker-end="url(#a1)"/>
      <rect class="bx" x="200" y="710" width="100" height="56" rx="6"/>
      <text class="t" x="250" y="733" text-anchor="middle">List</text>
      <text class="s" x="250" y="751" text-anchor="middle">one row</text>
      <rect class="bx" x="310" y="710" width="100" height="56" rx="6"/>
      <text class="t" x="360" y="733" text-anchor="middle">Map</text>
      <text class="s" x="360" y="751" text-anchor="middle">one marker</text>
      <rect class="bx" x="420" y="710" width="100" height="56" rx="6"/>
      <text class="t" x="470" y="733" text-anchor="middle">Beep · notice</text>
      <text class="s" x="470" y="751" text-anchor="middle">by priority</text>
    </svg>
