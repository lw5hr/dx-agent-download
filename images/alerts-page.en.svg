<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300">
<title>The dashboard's filters</title>
<style>
  .bg { fill: #ffffff; }
  .bx { fill: #ffffff; stroke: #c3cdd7; stroke-width: 1.2; }
  .bx-main { fill: #dcecf2; stroke: #0d6a8a; stroke-width: 1.4; }
  .bx-group { fill: none; stroke: #c3cdd7; stroke-width: 1.2; stroke-dasharray: 5 4; }
  .bx-pass { fill: #dcefe4; stroke: #1b7547; stroke-width: 1.4; }
  text { font-family: -apple-system, "Segoe UI", system-ui, Roboto, Helvetica, Arial, sans-serif; }
  .t { fill: #16212c; font-size: 13px; font-weight: 600; }
  .s { fill: #586877; font-size: 11.5px; }
  .km { fill: #586877; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11px; }
  .lbl { fill: #586877; font-size: 11px; font-style: italic; }
  .ar { stroke: #16212c; stroke-width: 1.3; fill: none; }
  .ar-dash { stroke: #586877; stroke-width: 1.3; fill: none; stroke-dasharray: 5 4; }
  .ar-drop { stroke: #7d8995; stroke-width: 1.3; fill: none; }
  .ar-wait { stroke: #a86300; stroke-width: 1.3; fill: none; }
  .ar-pass { stroke: #1b7547; stroke-width: 1.3; fill: none; }
  .x-drop { fill: #7d8995; font-size: 12px; }
  .x-wait { fill: #a86300; font-size: 12px; font-weight: 500; }
  .x-pass { fill: #1b7547; font-size: 12px; font-weight: 600; }
  .m-ink { fill: #16212c; } .m-muted { fill: #586877; } .m-drop { fill: #7d8995; }
  .m-wait { fill: #a86300; } .m-pass { fill: #1b7547; }
  .edge { stroke: #0d6a8a; stroke-width: 1.2; stroke-dasharray: 2 5; }
  .edge-t { fill: #0d6a8a; font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace; font-size: 11px; letter-spacing: .06em; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #161f28; }
    .bx { fill: #161f28; stroke: #3a4857; }
    .bx-main { fill: #15303c; stroke: #5bb6d8; }
    .bx-group { stroke: #3a4857; }
    .bx-pass { fill: #12301f; stroke: #55c48c; }
    .t { fill: #e2e8ee; } .s, .km, .lbl { fill: #93a2b0; }
    .ar { stroke: #e2e8ee; } .ar-dash { stroke: #93a2b0; } .ar-drop { stroke: #6f7d8a; }
    .ar-wait { stroke: #e3a548; } .ar-pass { stroke: #55c48c; }
    .x-drop { fill: #6f7d8a; } .x-wait { fill: #e3a548; } .x-pass { fill: #55c48c; }
    .m-ink { fill: #e2e8ee; } .m-muted { fill: #93a2b0; } .m-drop { fill: #6f7d8a; }
    .m-wait { fill: #e3a548; } .m-pass { fill: #55c48c; }
    .edge { stroke: #5bb6d8; } .edge-t { fill: #5bb6d8; }
  }
</style>
<rect class="bg" x="0" y="0" width="720" height="300" rx="10"/>
      <defs>
        <marker id="c1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="m-ink"/></marker>
        <marker id="cd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" class="m-drop"/></marker>
      </defs>
      <rect class="bx" x="20" y="120" width="140" height="56" rx="6"/>
      <text class="t" x="90" y="143" text-anchor="middle">An alert comes in</text>
      <text class="s" x="90" y="161" text-anchor="middle">from the server, live</text>
      <line class="ar" x1="160" y1="148" x2="198" y2="148" marker-end="url(#c1)"/>

      <rect class="bx-main" x="200" y="120" width="210" height="56" rx="8"/>
      <text class="t" x="305" y="143" text-anchor="middle">Does it pass the filters?</text>
      <text class="s" x="305" y="161" text-anchor="middle">all of them (table below)</text>

      <line class="ar" x1="410" y1="148" x2="440" y2="148"/>
      <line class="ar" x1="440" y1="58" x2="440" y2="238"/>
      <line class="ar" x1="440" y1="58" x2="468" y2="58" marker-end="url(#c1)"/>
      <line class="ar" x1="440" y1="148" x2="468" y2="148" marker-end="url(#c1)"/>
      <line class="ar" x1="440" y1="238" x2="468" y2="238" marker-end="url(#c1)"/>
      <text class="lbl" x="416" y="140">yes</text>

      <rect class="bx" x="470" y="30" width="230" height="56" rx="6"/>
      <text class="t" x="482" y="53">In the list and on the map</text>
      <text class="s" x="482" y="71">“Latest row only”: replaces ±3 kHz</text>
      <rect class="bx" x="470" y="120" width="230" height="56" rx="6"/>
      <text class="t" x="482" y="143">Beep</text>
      <text class="s" x="482" y="161">sound on · priority ≤ 2</text>
      <rect class="bx" x="470" y="210" width="230" height="56" rx="6"/>
      <text class="t" x="482" y="233">Notice on the dashboard</text>
      <text class="s" x="482" y="251">priority ≤ pop-up level</text>

      <line class="ar-drop" x1="305" y1="176" x2="305" y2="218" marker-end="url(#cd)"/>
      <text class="lbl" x="313" y="202">no</text>
      <rect class="bx" x="200" y="220" width="210" height="56" rx="6"/>
      <text class="t" x="305" y="243" text-anchor="middle">It is kept</text>
      <text class="s" x="305" y="261" text-anchor="middle">shows when you change the filter</text>
    </svg>
